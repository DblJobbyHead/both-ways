function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function open_(pw){var d=u8(B),salt=d.slice(8,16),ct=d.slice(16);
 var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 var bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:IT,hash:'SHA-256'},base,384));
 var key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct);
 return new TextDecoder().decode(pt)}

 try{var h=await open_(pw);try{if(remember)localStorage.setItem('bw.k',pw)}catch(e){}
